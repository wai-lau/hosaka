<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hosaka</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e0f13;
        color: #e6e6e6;
        font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main { width: min(560px, 92vw); padding: 1.5rem 0; }
      h1 { font-size: 1rem; letter-spacing: 0.3em; color: #8aa; margin: 0 0 1rem; }
      textarea, select, input, button {
        font: inherit;
        color: inherit;
        background: #16181f;
        border: 1px solid #2a2d36;
        border-radius: 6px;
        padding: 0.55rem 0.7rem;
      }
      textarea { width: 100%; resize: vertical; min-height: 5rem; box-sizing: border-box; }
      select { width: 100%; margin: 0.6rem 0; box-sizing: border-box; }
      button {
        cursor: pointer;
        background: #2b6cb0;
        border-color: #2b6cb0;
        font-weight: 600;
        width: 100%;
        margin-top: 0.8rem;
      }
      button:hover { background: #3a7fc4; }
      #status { margin-top: 0.8rem; color: #889; min-height: 1.3em; }

      /* voice selector + Speak share one row */
      .row { display: flex; gap: 0.6rem; align-items: stretch; margin: 0.6rem 0; }
      .row select { flex: 1; width: auto; margin: 0; }
      .row button { width: auto; margin: 0; white-space: nowrap; padding-left: 1.3rem; padding-right: 1.3rem; }

      .knobs { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.4rem; }
      .knob { display: grid; grid-template-columns: 7.5rem 1fr 3rem; align-items: center; gap: 0.6rem; }
      .knob .kname { color: #aab; font-size: 0.85rem; }
      .knob .kval { color: #ccd; font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
      .knob input[type="range"] { width: 100%; padding: 0; background: none; border: none; accent-color: #2b6cb0; }
      #cb-knobs { transition: opacity 0.15s; }
      #cb-knobs.off { opacity: 0.35; }
      .group-label { color: #667; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; margin: 0.6rem 0 0.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>HOSAKA</h1>
      <textarea id="text" placeholder="Type something to speak...">So, there's a project that I've been working on that I really want to talk to you about---

It's called Hosaka! I know the name sounds like a Japanese computer brand from Neuromancer, and--- Well, it is!

Okay, full honesty, setting it up is a teeeeeny-tiny-little bit temperamental. You have to install everything in just the right order or it gets all manic; It doesn't find the graphics card and the whole thing screams at you and you're up all night and — then the next day you're trying to sell this piece of junk to some strangers on the internet!- Uh, I mean, friends! I mean friends!</textarea>

      <div class="row">
        <select id="voice"><option>loading voices...</option></select>
        <button id="speak">Speak</button>
      </div>

      <div id="cb-knobs">
        <div class="group-label">clone knobs (chatterbox)</div>
        <div class="knobs">
          <label class="knob"><span class="kname">exaggeration</span>
            <input type="range" id="exaggeration" min="0" max="2" step="0.05" value="0.65" />
            <span class="kval" id="exaggeration-val"></span></label>
          <label class="knob"><span class="kname">cfg_weight</span>
            <input type="range" id="cfg_weight" min="0" max="1" step="0.05" value="0.6" />
            <span class="kval" id="cfg_weight-val"></span></label>
          <label class="knob"><span class="kname">temperature</span>
            <input type="range" id="temperature" min="0.1" max="2" step="0.05" value="0.2" />
            <span class="kval" id="temperature-val"></span></label>
        </div>
      </div>

      <div class="group-label">playback</div>
      <div class="knobs">
        <label class="knob"><span class="kname">speed</span>
          <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1.2" />
          <span class="kval" id="speed-val"></span></label>
        <label class="knob"><span class="kname">volume</span>
          <input type="range" id="volume" min="0" max="5" step="0.1" value="1.0" />
          <span class="kval" id="volume-val"></span></label>
      </div>

      <div id="status">idle</div>
    </main>
    <script src="/app/app.js"></script>
  </body>
</html>
